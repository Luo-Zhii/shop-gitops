{{- if .Values.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - {key: shopnow.io/rollout-role, operator: DoesNotExist}
  # Gắn hash pod để AnalysisTemplate tách số liệu bản canary
  podTargetLabels: [rollouts-pod-template-hash, app.kubernetes.io/version]
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: env
          replacement: {{ .Values.global.env }}
        - targetLabel: provider
          replacement: {{ .Values.global.provider }}
{{- end }}
