# Loki 3 SingleBinary (đủ cho khoá luận); nhận log OTLP từ otel-agent qua /otlp
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3
  storage:
    type: s3
    bucketNames: {chunks: shopnow-loki, ruler: shopnow-loki, admin: shopnow-loki}
singleBinary:
  replicas: 1
  persistence: {enabled: true, size: 20Gi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: true}
monitoring:
  serviceMonitor: {enabled: true, labels: {release: kube-prometheus-stack}}
