# AWS: Secrets Manager qua IRSA của controller external-secrets (role chỉ đọc secret prefix shopnow/*).
# Cùng tên khoá như Vault (shopnow/<service>, shopnow/shared) → chart app không đổi; tách môi trường bằng tài khoản AWS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  conditions:
    - namespaces: [shopnow, shopnow-data, kafka, monitoring, observability, longhorn-system, cert-manager]
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
