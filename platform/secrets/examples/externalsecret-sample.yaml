# Mẫu tham khảo (không được kustomization nào tham chiếu). Chart shopnow-service tự sinh ExternalSecret tương tự.
# Ghi bí mật vào Vault:   vault kv put kv-dev/shopnow/order db_username=orders db_password="$(openssl rand -base64 24)"
# Ghi vào AWS SM:         aws secretsmanager create-secret --name shopnow/order --secret-string '{"db_username":"orders","db_password":"..."}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-secrets-sample
  namespace: shopnow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault                       # prod-aws: aws-secrets-manager
  target:
    name: order-secrets-sample
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@shopnow-pg-rw.shopnow-data.svc:5432/orders?sslmode=require"
  data:
    - {secretKey: db_username, remoteRef: {key: shopnow/order, property: db_username}}
    - {secretKey: db_password, remoteRef: {key: shopnow/order, property: db_password}}
    - {secretKey: INTERNAL_TOKEN, remoteRef: {key: shopnow/shared, property: INTERNAL_TOKEN}}
