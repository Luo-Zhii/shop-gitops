# Sinh theo bảng topic trong shop-microservice/docs/architecture.md §3. Mỗi topic có <topic>.dlq.
# Key = subject (id thực thể) → thứ tự theo thực thể; số partition = mức song song tối đa của consumer (KEDA không vượt).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: identity.user.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: shopnow-kafka
    shopnow.io/topic-kind: main
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    shopnow.io/producer: "identity"
    shopnow.io/consumers: "user-profile, notification"
spec:
  topicName: identity.user.v1
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"
    min.insync.replicas: "2"
    cleanup.policy: delete
    compression.type: zstd
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: identity.user.v1.dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: shopnow-kafka
    shopnow.io/topic-kind: dlq
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    shopnow.io/producer: "consumers of identity.user.v1"
    shopnow.io/consumers: "ops (replay thủ công)"
spec:
  topicName: identity.user.v1.dlq
  partitions: 1
  replicas: 3
  config:
    retention.ms: "1209600000"
    min.insync.replicas: "2"
    cleanup.policy: delete
    compression.type: zstd
