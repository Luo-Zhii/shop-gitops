# Mỗi service một database + một role sở hữu (database-per-service).
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: shopnow-pg-identity
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  cluster: {name: shopnow-pg}
  name: identity
  owner: identity
  ensure: present
  databaseReclaimPolicy: retain
