# Pull secret Harbor (robot account chỉ đọc project shopnow)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: shopnow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: harbor-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"registry.luo.io.vn":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - {secretKey: username, remoteRef: {key: shopnow/harbor-robot, property: username}}
    - {secretKey: password, remoteRef: {key: shopnow/harbor-robot, property: password}}
