# Mật khẩu role lấy từ secret store (khoá shopnow/<service>, thuộc tính db_username/db_password) — cùng khoá app dùng dựng DATABASE_URL.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-identity
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: pg-identity
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
  data:
    - {secretKey: username, remoteRef: {key: shopnow/identity, property: db_username}}
    - {secretKey: password, remoteRef: {key: shopnow/identity, property: db_password}}
