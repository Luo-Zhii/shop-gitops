# Cảnh báo cho các phân hệ thêm 20/11/2026. Nhãn service để Alertmanager → AIOps gom đúng sự cố và chạy RCA.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shopnow-platform-ext
  namespace: monitoring
  labels: {release: kube-prometheus-stack}
spec:
  groups:
    - name: shopnow-aiops-agent
      rules:
        - alert: AIOpsGitopsPrRejected
          expr: sum(increase(aiops_gitops_prs_total{verdict=~"rejected|patch_error"}[1h])) > 2
          labels: {severity: warning, service: aiops}
          annotations:
            summary: "Cổng xác minh chặn > 2 PR khắc phục của tác tử trong 1h — rà công cụ/runbook"
        - alert: AIOpsAgentCostPerTaskHigh
          expr: >-
            sum(increase(aiops_agent_cost_usd_total[24h]))
            / clamp_min(sum(increase(aiops_agent_investigations_total[24h])), 1) > 0.5
          for: 30m
          labels: {severity: warning, service: aiops, category: finops}
          annotations:
            summary: "Chi phí LLM trung bình mỗi lần điều tra > 0.5 USD (24h)"
    - name: shopnow-ledger-audit
      rules:
        - alert: LedgerDuplicatePayout
          expr: sum(increase(aiops_ledger_findings_total{rule="duplicate"}[1h])) > 0
          labels: {severity: critical, service: accounting, category: audit}
          annotations:
            summary: "Nghi chi trả seller trùng trong 24h — kiểm tra trước khi chuyển tiền tiếp"
        - alert: LedgerBenfordNonconformity
          expr: sum(increase(aiops_ledger_findings_total{rule="benford"}[24h])) > 0
          labels: {severity: warning, service: accounting, category: audit}
          annotations:
            summary: "Phân phối chữ số đầu của số tiền lệch luật Benford — kiểm toán chọn mẫu"
    - name: shopnow-business-ops
      rules:
        - alert: WarehouseOutboxBacklog
          expr: max by (service) (outbox_pending{service=~"accounting|warehouse"}) > 500
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.service }}: outbox tồn > 500 sự kiện — Kafka/relay có vấn đề"
        - alert: WebJsErrorsSpike
          expr: sum(rate(web_errors_total[5m])) > 1
          for: 10m
          labels: {severity: warning, service: web, category: user-experience}
          annotations:
            summary: "Lỗi JavaScript phía trình duyệt > 1/giây trong 10 phút"
    # FinOps: chi phí hạ tầng (OpenCost, USD/giờ) quy về đơn vị kinh doanh — chi phí trên mỗi đơn hàng
    - name: shopnow-finops
      interval: 5m
      rules:
        - record: shopnow:infra_cost_usd_per_hour
          expr: sum(node_total_hourly_cost)
        - record: shopnow:namespace_cost_usd_per_hour
          expr: >-
            sum by (namespace) (container_cpu_allocation * on (node) group_left() node_cpu_hourly_cost)
            + sum by (namespace) (container_memory_allocation_bytes / 1073741824 * on (node) group_left() node_ram_hourly_cost)
        - record: shopnow:orders_per_hour
          expr: sum(rate(orders_created_total[1h])) * 3600
        - record: shopnow:cost_per_order_usd
          expr: shopnow:infra_cost_usd_per_hour / clamp_min(shopnow:orders_per_hour, 1)
        - alert: CostPerOrderRegression
          # chi phí/đơn tăng > 50% so với cùng giờ tuần trước (loại trừ khi lượng đơn quá ít)
          expr: >-
            shopnow:cost_per_order_usd > 1.5 * (shopnow:cost_per_order_usd offset 1w)
            and shopnow:orders_per_hour > 20
          for: 2h
          labels: {severity: warning, category: finops}
          annotations:
            summary: "Chi phí hạ tầng trên mỗi đơn tăng > 50% so với tuần trước — xem namespace nào tăng"
    # DORA (aiops_dora_* do AIOps tính từ deploy_records + sự cố): cảnh báo xu hướng quy trình, mức ticket, không page
    - name: shopnow-dora
      interval: 5m
      rules:
        - alert: DoraChangeFailureRateHigh
          expr: aiops_dora_value{metric="change_failure_rate", environment=~"prod-.*"} > 0.15
          for: 6h
          labels: {severity: warning, category: delivery}
          annotations:
            summary: "{{ $labels.environment }}: change failure rate 30 ngày {{ $value | humanizePercentage }} (> 15%, mức low)"
            description: "Xem tab Thay đổi ở /admin/aiops: deploy nào gây sự cố theo RCA, yếu tố rủi ro nào nổi bật."
        - alert: DoraBandRegressed
          # một chỉ số tụt mức so với 7 ngày trước và giữ nguyên 1 ngày (tránh dao động quanh ngưỡng)
          expr: aiops_dora_band{environment=~"prod-.*"} > (aiops_dora_band{environment=~"prod-.*"} offset 7d)
          for: 1d
          labels: {severity: warning, category: delivery}
          annotations:
            summary: "{{ $labels.environment }}: DORA {{ $labels.metric }} tụt mức so với tuần trước"
    # Giám sát tổng hợp: bước hỏng mang nhãn service của bước → Alertmanager → AIOps mở sự cố đúng service, RCA từ đó
    - name: shopnow-synthetic
      rules:
        - alert: SyntheticStepFailing
          # hỏng 3 lần chạy liên tiếp (robot chạy mỗi phút) — tránh báo vì một request lẻ
          expr: max_over_time(synthetic_step_success[3m]) == 0
          labels: {severity: warning, category: user-experience}
          annotations:
            summary: "{{ $labels.location }}: bước {{ $labels.step }} của hành trình mua hàng tổng hợp hỏng 3 phút ({{ $labels.service }})"
        - alert: SyntheticLocationDivergence
          # một vị trí hỏng trong khi vị trí kia vẫn đi trót lọt → nghi mạng/ingress/cụm, không phải lỗi ứng dụng
          expr: >-
            (count by (journey) (synthetic_journey_success == 0) > 0)
            and on (journey) (count by (journey) (synthetic_journey_success == 1) > 0)
          for: 5m
          labels: {severity: warning, service: api-gateway, category: hybrid-network}
          annotations:
            summary: "Hành trình tổng hợp hỏng ở một cụm nhưng cụm kia vẫn chạy — kiểm tra mạng/ingress hybrid"
        - alert: SyntheticProbeStale
          expr: time() - max by (location) (synthetic_last_run_timestamp_seconds) > 300
          labels: {severity: warning, service: synthetic}
          annotations:
            summary: "{{ $labels.location }}: robot giám sát tổng hợp không chạy > 5 phút — mất khả năng phát hiện lỗi ngoài giờ"
    # FinOps cho GenAI (ai-service llm/budget.py): ngân sách LLM ngày; hết ngân sách → chat/mô tả tự về FAQ/template
    - name: shopnow-llm-finops
      rules:
        - record: shopnow:llm_cost_usd_per_hour
          expr: sum by (provider, feature) (rate(ai_llm_cost_usd_total[1h])) * 3600
        - alert: LlmBudgetLow
          expr: min(ai_llm_budget_remaining_ratio) < 0.2
          for: 10m
          labels: {severity: warning, category: finops}
          annotations:
            summary: "Ngân sách LLM ngày còn {{ $value | humanizePercentage }} — sắp hạ cấp chatbot về FAQ"
        - alert: LlmDegraded
          expr: max by (reason) (ai_llm_degraded) == 1
          for: 5m
          labels: {severity: warning, category: finops}
          annotations:
            summary: "Chatbot/sinh mô tả đang hạ cấp ({{ $labels.reason }}) — khách vẫn được trả lời theo FAQ"
    # Data consistency SLO giữa warehouse (hàng thật) và inventory (tồn để bán) — event mất/trùng làm lệch im lặng
    - name: shopnow-stock-consistency
      rules:
        - alert: StockDriftOversellRisk
          # inventory nhiều hơn hàng thật (lệch bền vững 2 lần đối soát) → bán vượt tồn; nhãn service=inventory để RCA
          expr: max(warehouse_stock_drift_skus{kind="over"}) > 0
          for: 10m
          labels: {severity: critical, service: inventory, category: data-consistency}
          annotations:
            summary: "{{ $value }} SKU có tồn bán > hàng thật trong kho — nguy cơ bán vượt tồn"
            runbook: "Xem /admin/warehouse → Đối soát tồn; kiểm consumer warehouse.stock_changed của inventory; admin bấm Đồng bộ lại"
        - alert: StockDriftUndersell
          expr: max(warehouse_stock_drift_skus{kind=~"under|missing"}) > 0
          for: 30m
          labels: {severity: warning, service: inventory, category: data-consistency}
          annotations:
            summary: "{{ $value }} SKU đang bán hụt so với hàng thật trong kho (mất doanh thu)"
        - alert: StockReconcileStale
          expr: time() - max(warehouse_reconcile_last_success_timestamp_seconds) > 1800
          for: 5m
          labels: {severity: warning, service: warehouse, category: data-consistency}
          annotations:
            summary: "Đối soát tồn warehouse ↔ inventory không chạy thành công > 30 phút — mất khả năng phát hiện lệch"
    # SLA xuất kho theo giờ cắt đơn (warehouse src/sla.ts): trước 14h xuất trong ngày, sau 14h xuất trước 12h hôm sau
    - name: shopnow-warehouse-sla
      rules:
        - alert: WarehousePickSlaBreach
          expr: max(warehouse_picks_overdue) > 0
          for: 15m
          labels: {severity: warning, service: warehouse, category: business}
          annotations:
            summary: "{{ $value }} phiếu lấy hàng quá hạn xuất kho — đơn trễ giao, nguy cơ phạt từ sàn/ĐVVC"
        - alert: WarehousePickBacklogRising
          # nhiều phiếu sắp quá hạn cùng lúc → báo trước để tăng người ca chiều
          expr: max(warehouse_picks_due_soon) > 20
          for: 10m
          labels: {severity: warning, service: warehouse, category: business}
          annotations:
            summary: "{{ $value }} phiếu sẽ quá hạn trong 2 giờ — cân nhắc tăng người đóng gói"
    # Sức khoẻ tài chính (accounting src/health.ts): tiền khách đã trả nhưng đơn không hoàn tất/hoàn tiền
    - name: shopnow-finance-health
      rules:
        - alert: EscrowFundsStale
          expr: max(accounting_escrow_stale_checkouts) > 0
          for: 30m
          labels: {severity: warning, service: accounting, category: business}
          annotations:
            summary: "{{ $value }} checkout có tiền thu hộ treo > 15 ngày — saga đơn kẹt, phải hoàn tất hoặc hoàn tiền"
            runbook: "Xem /admin/accounting → Khoá sổ (checklist escrow_stale); đối chiếu trạng thái đơn ở order service"
        - alert: CodUnreconciled
          expr: max(accounting_cod_open_vnd) > 50000000
          for: 1h
          labels: {severity: warning, service: accounting, category: business}
          annotations:
            summary: "{{ $value | humanize }} đ COD ĐVVC giữ quá 15 ngày chưa đối soát — rủi ro thất thoát dòng tiền"
    # Dự báo ngày cạn error budget (AIOps Theil–Sen 24h) — báo TRƯỚC khi hết budget để kịp đóng băng/dồn người sửa
    - name: shopnow-slo-forecast
      rules:
        - alert: SloBudgetExhaustionForecast
          expr: min by (slo) (aiops_slo_budget_eta_hours) < 48
          for: 30m
          labels: {severity: warning, category: reliability}
          annotations:
            summary: "SLO {{ $labels.slo }}: theo xu hướng 24h, error budget sẽ cạn sau ~{{ $value | humanize }} giờ"
            runbook: "Xem /admin/aiops → SLO; cân nhắc đóng băng thay đổi không khẩn cấp và ưu tiên sửa lỗi độ tin cậy"
    # DevSecOps: SLA vá lỗ hổng của workload ĐANG CHẠY (Trivy Operator → AIOps /security/vulns)
    - name: shopnow-warehouse-accuracy
      rules:
        # độ chính xác tồn kho: báo không thấy hàng tại kệ dồn dập = số hệ thống sai hàng loạt (nhập sai kệ, mất hàng, lỗi đồng bộ)
        - alert: WarehousePickNotFoundSpike
          expr: sum by (warehouse) (increase(warehouse_pick_exceptions_total[1h])) > 5
          for: 15m
          labels: {severity: warning, category: delivery}
          annotations:
            summary: "Kho {{ $labels.warehouse }}: {{ $value | humanize }} lần báo không thấy hàng tại kệ trong 1 giờ"
            runbook: "Xem /admin/warehouse → Kiểm kê → Kiểm kê đột xuất; rà phiếu nhập gần nhất (cất sai kệ?) và lệch tồn với inventory"
        - alert: WarehouseSpotCountsPiling
          expr: warehouse_spot_counts_open > 20
          for: 2h
          labels: {severity: info, category: delivery}
          annotations:
            summary: "{{ $value }} phiếu kiểm kê đột xuất đang chờ đếm"
            runbook: "Bố trí người đếm; SKU có vấn đề còn sai số cho tới khi phiếu được đếm và duyệt"
    - name: shopnow-carriers
      rules:
        # SLO đối tác vận chuyển — lỗi của BÊN THỨ BA: không mở sự cố AIOps (RCA sẽ đi tìm lỗi trong code mình), báo đội vận hành
        # giao hàng làm việc với hãng; service shipping đã tự tránh hãng xuống cấp cho đơn mới.
        - alert: CarrierOnTimeBelowSLO
          expr: shipping_carrier_on_time_ratio < 0.85
          for: 2h
          labels: {severity: warning, category: partner}
          annotations:
            summary: "Hãng {{ $labels.carrier }} giao đúng hạn {{ $value | humanizePercentage }} (7 ngày) — dưới SLO 85%"
            runbook: "Xem /admin/shipping; làm việc với hãng; cần dừng hẳn thì tắt flag carrier-<mã> qua PR GitOps"
        - alert: CarrierWebhookSilent
          expr: shipping_carrier_webhook_age_seconds > 6 * 3600 and on (carrier) shipping_carrier_active_shipments > 0
          for: 30m
          labels: {severity: warning, category: partner}
          annotations:
            summary: "Hãng {{ $labels.carrier }} im lặng {{ $value | humanizeDuration }} dù còn vận đơn đang chạy — tích hợp webhook có thể hỏng"
            runbook: "Kiểm tra chữ ký/endpoint webhook với hãng; khách đang không thấy trạng thái giao hàng"
        - alert: CarrierStuckShipments
          expr: shipping_carrier_stuck_shipments > 20
          for: 1h
          labels: {severity: info, category: partner}
          annotations:
            summary: "{{ $value }} vận đơn của {{ $labels.carrier }} không đổi trạng thái quá 48 giờ"
            runbook: "Xuất danh sách cho hãng tra soát; CSKH chủ động báo khách trước khi khách khiếu nại"
    - name: shopnow-toil
      rules:
        # gauge cập nhật mỗi lần AIOps lập báo cáo tự động hoá (ít nhất mỗi sáng qua CronJob bản tin bàn giao ca)
        - alert: ToilOverBudget
          expr: aiops_toil_share > 0.5
          for: 1h
          labels: {severity: info, category: delivery}
          annotations:
            summary: "Toil chiếm {{ $value | humanizePercentage }} giờ trực 28 ngày qua — vượt ngân sách SRE 50%"
            runbook: "Xem /admin/aiops → Tự động hoá: duyệt bản vá bỏ duyệt tay cho luật đủ thành tích, viết luật cho nhóm sự cố lặp"
    - name: shopnow-vuln-sla
      rules:
        - alert: VulnerabilitySlaBreach
          expr: max by (severity) (aiops_vuln_sla_breaches) > 0
          for: 1h
          labels: {severity: warning, category: security}
          annotations:
            summary: "{{ $value }} lỗ hổng {{ $labels.severity }} đã có bản sửa nhưng quá hạn SLA vá (CRITICAL 7 ngày, HIGH 30 ngày)"
            runbook: "Xem /admin/aiops → Bảo mật; nâng phiên bản gói/base image, build lại qua CI (Trivy + ký + SLSA)"
        # CISA KEV: lỗ hổng ĐANG bị khai thác ngoài thực tế trên workload đang chạy — báo ngay, không đợi quá hạn SLA
        - alert: KnownExploitedVulnerabilityRunning
          expr: aiops_vuln_kev_open > 0
          for: 30m
          labels: {severity: warning, category: security}
          annotations:
            summary: "{{ $value }} lỗ hổng trong danh mục CISA KEV đang chạy trên production (hạn vá 3 ngày từ lúc vào KEV)"
            runbook: "Xem /admin/aiops → Bảo mật (P1); chưa có bản sửa → biện pháp tạm: chặn đường vào ở gateway/NetworkPolicy, tắt tính năng bằng kill switch flagd"
