# Tài nguyên mẫu: good-* phải pass, bad-* phải fail đúng policy tương ứng
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: shopnow
  labels: {app.kubernetes.io/name: order}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: order
    image: registry.luo.io.vn/shopnow/order:v2.0.0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: '1', memory: 384Mi}
    livenessProbe:
      httpGet: {path: /healthz, port: 8109}
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /readyz, port: 8109}
      periodSeconds: 5
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
---
