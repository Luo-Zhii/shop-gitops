name: api-gateway
port: 8080
ingress:
  enabled: true
  hostPrefix: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE /api/notification/notifications/stream
uses:
  redis: {enabled: true, db: 0}       # rate limit
externalSecret:
  sharedKeys: [INTERNAL_TOKEN, SYNTHETIC_TOKEN]   # SYNTHETIC_TOKEN: robot giám sát tổng hợp → gắn x-synthetic
rollout:
  enabled: true
  trafficRouting: nginx               # prod-aws ghi đè thành alb
autoscaling:
  type: keda
  minReplicas: 2
  maxReplicas: 12
  keda:
    rpsPerPod: 150
    predictive: true                  # scale trước theo dự báo Holt-Winters của AIOps
networkPolicy:
  ingress:
    fromGateway: false
    fromIngressController: true
    fromServices: [web, synthetic]    # Next.js SSR gọi BFF; robot giám sát tổng hợp
resources:
  requests: {cpu: 200m, memory: 192Mi}
  limits: {cpu: "1", memory: 512Mi}
metrics:
  prometheusRule:
    p95WarningSeconds: 0.8
