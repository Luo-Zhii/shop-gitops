name: warehouse
port: 8116
uses:
  postgres: {enabled: true, database: warehouse}
  kafka: {enabled: true}              # consumer order.v1 → phiếu lấy hàng FIFO
env:
  COUNT_APPROVAL_THRESHOLD: "2000000"
  STORAGE_FEE_PER_UNIT_DAY: "50"
  PICK_CUTOFF_HOUR: "14"              # giờ cắt đơn (giờ VN) cho SLA xuất kho
  RECONCILE_INTERVAL_SECONDS: "300"   # đối soát tồn với inventory (INVENTORY_URL từ values-common)
networkPolicy:
  ingress:
    fromServices: [api-gateway]
# Canary cho service tiêu thụ Kafka: theo số replica (không traffic router) — pod canary vào cùng consumer group, nhận
# ~1/N partition; AnalysisTemplate đo DLQ ratio + 5xx/p95 API + cổng AIOps của riêng bản canary.
rollout:
  enabled: true
  analysis:
    consumer: {enabled: true, maxDlqRatio: 0.01}
