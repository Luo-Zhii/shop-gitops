# Namespace ứng dụng & dữ liệu (namespace của addon do Argo CD CreateNamespace tạo)
apiVersion: v1
kind: Namespace
metadata:
  name: shopnow
  labels:
    shopnow.io/tenant: shopnow
    shopnow.io/enforce-policies: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: shopnow-data
  labels:
    shopnow.io/tenant: shopnow
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    shopnow.io/tenant: shopnow
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
