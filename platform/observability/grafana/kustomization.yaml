apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - datasources.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: ShopNow
configMapGenerator:
  - name: dashboard-shopnow-red
    files: [dashboards/shopnow-red.json]
  - name: dashboard-shopnow-checkout-saga
    files: [dashboards/shopnow-checkout-saga.json]
  - name: dashboard-shopnow-kafka-dlq-outbox
    files: [dashboards/shopnow-kafka-dlq-outbox.json]
  - name: dashboard-shopnow-aiops
    files: [dashboards/shopnow-aiops.json]
