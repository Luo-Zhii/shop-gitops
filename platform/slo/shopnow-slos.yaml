# SLO khai báo bằng Sloth → controller sinh recording rule + cảnh báo multi-window multi-burn-rate
# (page: 1h/5m @14.4x & 6h/30m @6x → severity=critical; ticket: 1d/2h @3x & 3d/6h @1x → severity=warning).
# Cả hai đều được Alertmanager đẩy tới AIOps + Telegram. Cửa sổ SLO: 30 ngày.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: shopnow
  namespace: monitoring
  labels: {release: kube-prometheus-stack}
spec:
  service: shopnow
  labels:
    team: shopnow
  slos:
    - name: gateway-availability
      objective: 99.5
      description: "api-gateway trả lời không lỗi 5xx (99.5% / 30 ngày)."
      sli:
        events:
          errorQuery: sum(rate(http_server_requests_seconds_count{service="api-gateway",status=~"5.."}[{{.window}}]))
          totalQuery: sum(rate(http_server_requests_seconds_count{service="api-gateway"}[{{.window}}]))
      alerting:
        name: ShopNowGatewayAvailabilityBurn
        labels: {service: api-gateway, category: availability}
        annotations:
          summary: "api-gateway đang đốt error budget availability 99.5%"
        pageAlert:
          labels: {severity: critical}
        ticketAlert:
          labels: {severity: warning}
    - name: checkout-latency
      objective: 95
      description: "p95 POST /checkout < 1.5s ⇔ ≥95% request checkout xong dưới 1.5s (histogram cần bucket le=1.5)."
      sli:
        events:
          errorQuery: |
            (
              sum(rate(http_server_requests_seconds_count{service="order",route="/checkout",method="POST"}[{{.window}}]))
              -
              sum(rate(http_server_requests_seconds_bucket{service="order",route="/checkout",method="POST",le="1.5"}[{{.window}}]))
            )
          totalQuery: sum(rate(http_server_requests_seconds_count{service="order",route="/checkout",method="POST"}[{{.window}}]))
      alerting:
        name: ShopNowCheckoutLatencyBurn
        labels: {service: order, category: latency}
        annotations:
          summary: "Checkout p95 vượt 1.5s quá ngân sách"
        pageAlert:
          labels: {severity: critical}
        ticketAlert:
          labels: {severity: warning}
    - name: order-saga-success
      objective: 99
      description: >-
        Saga đặt hàng kết thúc đúng (99%). Lỗi = đơn bị huỷ do hệ thống (timeout, reservation hết hạn, lỗi kỹ thuật);
        không tính huỷ do người mua, hết hàng hay thẻ bị từ chối. Đồng bộ danh sách reason với service order.
      sli:
        events:
          errorQuery: sum(rate(orders_cancelled_total{reason!~"BUYER_CANCELLED|OUT_OF_STOCK|PAYMENT_FAILED|PAYMENT_TIMEOUT"}[{{.window}}]))
          totalQuery: sum(rate(orders_created_total[{{.window}}]))
      alerting:
        name: ShopNowOrderSagaBurn
        labels: {service: order, category: saga}
        annotations:
          summary: "Tỉ lệ saga đặt hàng thất bại đốt error budget 99%"
        pageAlert:
          labels: {severity: critical}
        ticketAlert:
          labels: {severity: warning}
    - name: synthetic-journey
      objective: 99.5
      description: >-
        Hành trình mua hàng tổng hợp (home → search → product → giỏ khách) do robot chạy mỗi phút ở từng cụm. Bắt lỗi
        cả khi không có khách (ban đêm, ngay sau deploy) — điều mà SLO dựa trên traffic thật không làm được.
      sli:
        events:
          errorQuery: sum(rate(synthetic_journey_runs_total{result="failure"}[{{.window}}]))
          totalQuery: sum(rate(synthetic_journey_runs_total[{{.window}}]))
      alerting:
        name: ShopNowSyntheticJourneyBurn
        labels: {service: api-gateway, category: user-experience}
        annotations:
          summary: "Hành trình mua hàng tổng hợp thất bại — đốt error budget 99.5%"
        pageAlert:
          labels: {severity: critical}
        ticketAlert:
          labels: {severity: warning}
    - name: web-lcp-good
      objective: 75
      description: >-
        Trải nghiệm thật của người dùng (RUM): ≥ 75% lượt tải trang có LCP ≤ 2.5s — đúng ngưỡng "good" p75 của Core
        Web Vitals. Dữ liệu từ trình duyệt gửi về gateway /api/rum. Cảnh báo được gắn service=web để AIOps lần RCA
        từ web → api-gateway → backend.
      sli:
        events:
          errorQuery: >-
            sum(rate(web_vitals_seconds_count{name="LCP"}[{{.window}}]))
            - sum(rate(web_vitals_seconds_bucket{name="LCP",le="2.5"}[{{.window}}]))
          totalQuery: sum(rate(web_vitals_seconds_count{name="LCP"}[{{.window}}]))
      alerting:
        name: ShopNowWebLcpBurn
        labels: {service: web, category: user-experience}
        annotations:
          summary: "LCP thực tế của người dùng xấu đi — đốt error budget 75%"
        pageAlert:
          disable: true                     # trải nghiệm chậm → ticket, không gọi trực đêm
        ticketAlert:
          labels: {severity: warning}
    - name: catalog-availability
      objective: 99.5
      description: "catalog trả lời không lỗi 5xx (99.5% / 30 ngày) — SLO nền cho mọi service (scorecard Silver)."
      sli:
