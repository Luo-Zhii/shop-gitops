apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require requests and limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shopnow]
      validate:
        failureAction: Enforce
        message: "Mọi container phải khai báo requests.cpu, requests.memory và limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
