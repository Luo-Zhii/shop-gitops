# Backup lên MinIO (dev/staging) — prod-onprem patch sang S3 ap-southeast-1 (bản sao ngoài DC, phục vụ DR hybrid)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: shopnow-pg-backup
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://shopnow-pg-backups/
    endpointURL: http://minio.shopnow-data.svc
    s3Credentials:
      accessKeyId: {name: pg-backup-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: pg-backup-s3, key: ACCESS_SECRET_KEY}
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shopnow-pg-daily
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schedule: "0 0 2 * * *"      # 02:00 hằng ngày (cron 6 trường của CNPG)
  immediate: true
  backupOwnerReference: self
  cluster: {name: shopnow-pg}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-backup-s3
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: pg-backup-s3}
  data:
    - {secretKey: ACCESS_KEY_ID, remoteRef: {key: shopnow/pg-backup, property: access_key_id}}
    - {secretKey: ACCESS_SECRET_KEY, remoteRef: {key: shopnow/pg-backup, property: secret_access_key}}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shopnow-pg
  namespace: shopnow-data
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels: {cnpg.io/cluster: shopnow-pg}
  podMetricsEndpoints:
    - port: metrics
