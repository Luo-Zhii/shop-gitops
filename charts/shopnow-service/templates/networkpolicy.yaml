{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
{{- $ds := .Values.dataServices -}}
{{- $u := .Values.uses -}}
# Mặc định chặn hết; chỉ mở đúng luồng service này cần.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if $np.ingress.fromGateway }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        {{- end }}
        {{- with $np.ingress.fromServices }}
        # Service gọi đồng bộ (least privilege)
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson . }}
        {{- end }}
        {{- if $np.ingress.fromSameNamespace }}
        - podSelector: {}
        {{- end }}
        {{- if $np.ingress.fromIngressController }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingress.ingressControllerNamespace }}
        {{- end }}
        {{- range $np.ingress.fromCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
        # Prometheus scrape /metrics
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingress.monitoringNamespace }}
        {{- with $np.ingress.extra }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {port: http, protocol: TCP}
  egress:
    {{- if $np.egress.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- end }}
    {{- if $np.egress.sameNamespace }}
    # Gọi service khác trong namespace (HTTP nội bộ, JWKS của identity)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: {{ .Values.global.partOf }}
    {{- end }}
    {{- if .Values.otel.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.egress.otelNamespace }}
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
    {{- end }}
    {{- range $key := list "postgres" "redis" "kafka" "mongo" "opensearch" "s3" "smtp" }}
    {{- $use := index $u $key }}
    {{- $d := index $ds $key }}
    {{- if and $use.enabled (or $d.namespace $d.cidrs) }}
    # {{ $key }}
    - to:
        {{- include "svc.npPeers" $d | trim | nindent 8 }}
      ports:
        - {port: {{ $d.port }}, protocol: TCP}
        {{- if eq $key "kafka" }}
        - {port: 9093, protocol: TCP}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if $np.egress.httpsCIDRs }}
    - to:
        {{- range $np.egress.httpsCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
    {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
