name: payment
port: 8110
uses:
  postgres: {enabled: true, database: payment}
  kafka: {enabled: true}
externalSecret:
  keys: [VNPAY_TMN_CODE, VNPAY_HASH_SECRET]
env:
  VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  PAYMENT_RETURN_BASE_URL: "https://api.{{ .Values.global.domain }}/api/payment"
rollout:
  enabled: true
autoscaling:
  type: keda
  minReplicas: 2
  maxReplicas: 8
  keda:
    kafkaLag:
      - {topic: payment.command.v1, consumerGroup: payment, lagThreshold: 30}
networkPolicy:
  egress:
    httpsCIDRs: [0.0.0.0/0]           # cổng VNPay
