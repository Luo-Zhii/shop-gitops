# Chỉ chạy image ShopNow được ký Cosign keyless từ GitHub Actions của repo Luo-Zhii/shop-microservice
# (nhánh main hoặc tag v*). Kyverno ghim digest vào Pod (mutateDigest) để không bị đổi image sau khi xác minh.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify ShopNow image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-cosign-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shopnow]
      verifyImages:
        - imageReferences:
            - "ghcr.io/luo-zhii/shopnow/*"
            - "registry.luo.io.vn/shopnow/*"
            - "*.dkr.ecr.ap-southeast-1.amazonaws.com/shopnow/*"
          failureAction: Enforce
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: '^https://github\.com/Luo-Zhii/shop-microservice/\.github/workflows/[^@]+@refs/(heads/main|tags/v.+)$'
                    rekor:
                      url: https://rekor.sigstore.dev
