# Dải IP LAN cấp cho Service LoadBalancer (ingress-nginx) — chỉnh theo DC
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: shopnow-pool
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  addresses: [10.10.20.200-10.10.20.220]
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: shopnow-l2
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ipAddressPools: [shopnow-pool]
