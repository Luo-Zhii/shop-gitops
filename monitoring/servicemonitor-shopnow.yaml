# =============================================================================
# ServiceMonitors — ShopNow Microservices (Spring Boot Actuator)
# =============================================================================
# Prometheus sẽ tự động scrape metrics từ Spring Boot Actuator endpoints.
# Yêu cầu: Mỗi Spring Boot service phải có dependency:
#   - spring-boot-starter-actuator
#   - micrometer-registry-prometheus
#
# Endpoint mặc định: /actuator/prometheus
# =============================================================================

# --- API Gateway ServiceMonitor ---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: shopnow
spec:
  selector:
    matchLabels:
      app: api-gateway
  namespaceSelector:
    matchNames:
      - shopnow
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
---
