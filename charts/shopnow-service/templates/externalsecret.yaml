{{- if .Values.externalSecret.enabled -}}
{{- $es := .Values.externalSecret -}}
{{- $ds := .Values.dataServices -}}
{{- $u := .Values.uses -}}
{{- $own := printf "%s%s" $es.keyPrefix (include "svc.name" .) -}}
{{- $shared := printf "%sshared" $es.keyPrefix -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "svc.name" . }}-secrets
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "svc.name" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- if $u.postgres.enabled }}
        DATABASE_URL: {{ printf "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@%s:%v/%s?sslmode=%s" (required "dataServices.postgres.host" $ds.postgres.host) $ds.postgres.port (required "uses.postgres.database" $u.postgres.database) $ds.postgres.sslmode | quote }}
        {{- end }}
        {{- if $u.redis.enabled }}
        REDIS_URL: {{ printf "%s://:{{ .redis_password | urlquery }}@%s:%v/%v" (ternary "rediss" "redis" $ds.redis.tls) (required "dataServices.redis.host" $ds.redis.host) $ds.redis.port $u.redis.db | quote }}
        {{- end }}
        {{- if $u.mongo.enabled }}
        MONGO_URL: {{ printf "mongodb://{{ .mongo_username }}:{{ .mongo_password | urlquery }}@%s:%v/%s?%s" (required "dataServices.mongo.host" $ds.mongo.host) $ds.mongo.port (required "uses.mongo.database" $u.mongo.database) $ds.mongo.options | quote }}
        {{- end }}
  data:
    {{- if $u.postgres.enabled }}
    - {secretKey: db_username, remoteRef: {key: {{ $own }}, property: db_username}}
    - {secretKey: db_password, remoteRef: {key: {{ $own }}, property: db_password}}
    {{- end }}
    {{- if $u.mongo.enabled }}
    - {secretKey: mongo_username, remoteRef: {key: {{ $own }}, property: mongo_username}}
    - {secretKey: mongo_password, remoteRef: {key: {{ $own }}, property: mongo_password}}
    {{- end }}
    {{- if $u.redis.enabled }}
    - {secretKey: redis_password, remoteRef: {key: {{ $shared }}, property: redis_password}}
    {{- end }}
    {{- if and $u.s3.enabled $ds.s3.staticCredentials }}
    - {secretKey: S3_ACCESS_KEY, remoteRef: {key: {{ $shared }}, property: s3_access_key}}
    - {secretKey: S3_SECRET_KEY, remoteRef: {key: {{ $shared }}, property: s3_secret_key}}
    {{- end }}
    {{- range $es.sharedKeys }}
    - {secretKey: {{ . }}, remoteRef: {key: {{ $shared }}, property: {{ . }}}}
    {{- end }}
    {{- range $es.keys }}
    - {secretKey: {{ . }}, remoteRef: {key: {{ $own }}, property: {{ . }}}}
    {{- end }}
{{- end }}
