# Cài Argo CD trên cụm hub (on-prem, cụm quản trị):
#   helm upgrade --install argocd argo-cd --repo https://argoproj.github.io/argo-helm --version 10.15.0 \
#     -n argocd --create-namespace -f argocd/bootstrap/argocd-values.yaml
global:
  domain: argocd.luo.io.vn
configs:
  params:
    server.insecure: false
    applicationsetcontroller.policy: create-update     # AppSet không tự xoá Application (an toàn khi lỡ tay đổi generator)
  cm:
    admin.enabled: false
    exec.enabled: false
    timeout.reconciliation: 180s
    resource.exclusions: |
      - apiGroups: [cilium.io]
        kinds: [CiliumIdentity]
        clusters: ["*"]
    # SSO GitHub (org Luo-Zhii) — client secret qua ExternalSecret argocd-dex-github
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-dex-github:clientID
            clientSecret: $argocd-dex-github:clientSecret
            orgs: [{name: Luo-Zhii}]
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, Luo-Zhii:platform, role:admin
      p, role:release, applications, sync, shopnow/*, allow
      p, role:release, applications, action/argoproj.io/Rollout/*, shopnow/*, allow
      g, Luo-Zhii:developers, role:release
controller:
  replicas: 2
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
applicationSet:
  replicas: 2
server:
  replicas: 2
  ingress:
    enabled: true
    ingressClassName: nginx
    tls: true
    annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}
repoServer:
  replicas: 2
redis-ha:
  enabled: true
