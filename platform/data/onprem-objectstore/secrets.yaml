# Bí mật cho dịch vụ dữ liệu chỉ có ở on-prem (MinIO, Loki→MinIO, Longhorn backup)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-env
  namespace: shopnow-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: minio-env
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .root_user }}"
          export MINIO_ROOT_PASSWORD="{{ .root_password }}"
          export MINIO_PROMETHEUS_AUTH_TYPE="public"
  data:
    - {secretKey: root_user, remoteRef: {key: shopnow/minio, property: root_user}}
    - {secretKey: root_password, remoteRef: {key: shopnow/minio, property: root_password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: loki-s3}
  data:
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: shopnow/loki, property: access_key_id}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: shopnow/loki, property: secret_access_key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-s3
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: longhorn-backup-s3}
  data:
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: shopnow/longhorn-backup, property: access_key_id}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: shopnow/longhorn-backup, property: secret_access_key}}
    - {secretKey: AWS_ENDPOINTS, remoteRef: {key: shopnow/longhorn-backup, property: endpoint}}
