apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-shopnow
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: alertmanager-shopnow}
  data:
    - {secretKey: telegram-bot-token, remoteRef: {key: shopnow/alerting, property: telegram_bot_token}}
    - {secretKey: aiops-webhook-token, remoteRef: {key: shopnow/alerting, property: aiops_webhook_token}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: grafana-admin}
  data:
    - {secretKey: admin-user, remoteRef: {key: shopnow/grafana, property: admin_user}}
    - {secretKey: admin-password, remoteRef: {key: shopnow/grafana, property: admin_password}}
