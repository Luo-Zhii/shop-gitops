apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require liveness and readiness probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-probes
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shopnow]
      validate:
        failureAction: Enforce
        message: "Mọi container phải có livenessProbe và readinessProbe (/healthz, /readyz)."
        pattern:
          spec:
            containers:
              - livenessProbe:
                  periodSeconds: ">0"
                readinessProbe:
                  periodSeconds: ">0"
