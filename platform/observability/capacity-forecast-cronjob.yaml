# Làm mới dự báo dung lượng mỗi 15 phút → gauge aiops_forecast_rps (Prometheus scrape aiops) → trigger KEDA rps-forecast
# (bật bằng autoscaling.keda.predictive: true ở service). Namespace monitoring: NetworkPolicy của aiops đã mở sẵn.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: capacity-forecast
  namespace: monitoring
  labels: {app.kubernetes.io/name: capacity-forecast, app.kubernetes.io/part-of: shopnow}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: {app.kubernetes.io/name: capacity-forecast}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 100, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: refresh
              image: curlimages/curl:8.11.1
              args: ["-fsS", "-o", "/dev/null", "http://aiops.shopnow.svc:8120/capacity/forecast?hours=1"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
