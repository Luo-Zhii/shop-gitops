# Đồng bộ lỗ hổng workload đang chạy mỗi giờ: AIOps đọc VulnerabilityReport (Trivy Operator) → SLA vá lỗ hổng.
# Đặt ở namespace monitoring: NetworkPolicy của aiops đã mở cho namespace này (Alertmanager) và dùng chung token webhook.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vuln-sync
  namespace: monitoring
  labels: {app.kubernetes.io/name: vuln-sync, app.kubernetes.io/part-of: shopnow}
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels: {app.kubernetes.io/name: vuln-sync}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 100, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: sync
              image: curlimages/curl:8.11.1
              args: ["-fsS", "-X", "POST", "-H", "Authorization: Bearer $(TOKEN)", "http://aiops.shopnow.svc:8120/security/vulns/sync"]
              env:
                - name: TOKEN
                  valueFrom: {secretKeyRef: {name: alertmanager-shopnow, key: aiops-webhook-token}}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
