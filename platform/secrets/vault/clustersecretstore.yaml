# On-prem: HashiCorp Vault (KV v2). Mỗi môi trường một mount KV (dev/staging/prod-onprem — patch spec.provider.vault.path).
# Khoá: shopnow/<service> (db_username, db_password, mongo_*, khoá riêng), shopnow/shared (INTERNAL_TOKEN, redis_password, s3_*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  conditions:
    - namespaces: [shopnow, shopnow-data, kafka, monitoring, observability, longhorn-system, cert-manager]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv-dev
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
